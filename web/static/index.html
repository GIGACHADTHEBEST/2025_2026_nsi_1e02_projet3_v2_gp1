<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CheckersMind — Dames 10×10</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=JetBrains+Mono:wght@300;400;600&display=swap');

  :root {
    --bg:         #0d0d0d;
    --surface:    #141414;
    --border:     #2a2a2a;
    --gold:       #c9a84c;
    --gold-light: #e8c97a;
    --cream:      #f5f0e8;
    --dark-sq:    #2d1f0e;
    --light-sq:   #1a1a1a;
    --white-piece:#f0e6cc;
    --black-piece:#1a0a00;
    --king-glow:  #c9a84c;
    --red:        #e05050;
    --green:      #50c878;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }

  header {
    text-align: center;
    margin-bottom: 2rem;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900;
    letter-spacing: 0.05em;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p {
    font-size: 0.75rem;
    color: #666;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-top: 0.25rem;
  }

  .layout {
    display: grid;
    grid-template-columns: auto 260px;
    gap: 2rem;
    align-items: start;
    max-width: 900px;
    width: 100%;
  }

  /* ─── BOARD ─────────────────────────────── */
  .board-wrap {
    position: relative;
  }

  .coords-top, .coords-left {
    display: flex;
    font-size: 0.6rem;
    color: #444;
    letter-spacing: 0.1em;
  }

  .coords-top {
    padding-left: 20px;
    margin-bottom: 4px;
  }

  .coords-top span { width: 48px; text-align: center; }

  .coords-left {
    flex-direction: column;
    position: absolute;
    left: 0;
    top: 24px;
  }

  .coords-left span { height: 48px; display: flex; align-items: center; }

  #board {
    display: grid;
    grid-template-columns: repeat(10, 48px);
    grid-template-rows: repeat(10, 48px);
    border: 2px solid var(--border);
    margin-left: 20px;
    position: relative;
  }

  .cell {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: background 0.15s;
  }

  .cell.light { background: var(--light-sq); }
  .cell.dark  { background: var(--dark-sq); }

  .cell.dark:hover { background: #3d2a12; }

  .cell.selected {
    background: rgba(201, 168, 76, 0.35) !important;
    box-shadow: inset 0 0 0 2px var(--gold);
  }

  .cell.legal-target::after {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: rgba(201, 168, 76, 0.5);
    border: 2px solid var(--gold);
  }

  .cell.legal-target:hover::after {
    background: rgba(201, 168, 76, 0.8);
  }

  .cell.last-move {
    background: rgba(80, 200, 120, 0.15) !important;
  }

  /* ─── PIECES ─────────────────────────────── */
  .piece {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: transform 0.15s, box-shadow 0.15s;
    user-select: none;
    font-size: 1rem;
  }

  .piece:hover { transform: scale(1.08); }

  .piece.white {
    background: radial-gradient(circle at 35% 35%, #fff 0%, var(--white-piece) 60%, #c8b48a 100%);
    box-shadow: 0 3px 8px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.8);
    border: 2px solid #a89060;
  }

  .piece.black {
    background: radial-gradient(circle at 35% 35%, #4a2a10 0%, var(--black-piece) 60%, #000 100%);
    box-shadow: 0 3px 8px rgba(0,0,0,0.8), inset 0 1px 0 rgba(100,60,20,0.4);
    border: 2px solid #3a1a00;
  }

  .piece.king::before {
    content: '♛';
    font-size: 1.1rem;
    line-height: 1;
  }

  .piece.white.king::before { color: var(--gold); }
  .piece.black.king::before { color: var(--gold-light); filter: brightness(0.7); }

  .piece.king {
    box-shadow: 0 3px 8px rgba(0,0,0,0.6), 0 0 12px rgba(201,168,76,0.4), inset 0 1px 0 rgba(255,255,255,0.5);
  }

  /* ─── PANEL ─────────────────────────────── */
  .panel {
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.2rem;
  }

  .card h3 {
    font-family: 'Playfair Display', serif;
    font-size: 0.9rem;
    color: var(--gold);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 0.8rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }

  .score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.3rem 0;
  }

  .score-label {
    font-size: 0.7rem;
    color: #888;
    letter-spacing: 0.1em;
  }

  .score-val {
    font-size: 1.2rem;
    font-weight: 600;
  }

  .score-val.white-c { color: var(--white-piece); }
  .score-val.black-c { color: #888; }

  #status {
    font-size: 0.75rem;
    line-height: 1.6;
    color: #aaa;
    min-height: 3rem;
  }

  #status .player-badge {
    display: inline-block;
    padding: 0.1em 0.6em;
    border-radius: 2px;
    font-weight: 600;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
  }

  #status .badge-white { background: var(--white-piece); color: #333; }
  #status .badge-black { background: #333; color: var(--white-piece); border: 1px solid #555; }
  #status .badge-ai    { background: var(--gold); color: #111; }

  .btn {
    display: block;
    width: 100%;
    padding: 0.7rem 1rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: transparent;
    color: var(--cream);
    transition: all 0.2s;
    margin-bottom: 0.5rem;
  }

  .btn:hover { border-color: var(--gold); color: var(--gold); }

  .btn.primary {
    border-color: var(--gold);
    color: var(--gold);
  }

  .btn.primary:hover {
    background: var(--gold);
    color: #111;
  }

  .btn:disabled { opacity: 0.3; cursor: not-allowed; }

  #log {
    font-size: 0.65rem;
    line-height: 1.8;
    color: #666;
    max-height: 160px;
    overflow-y: auto;
    font-family: 'JetBrains Mono', monospace;
  }

  #log .entry { border-bottom: 1px solid #1e1e1e; padding: 2px 0; }
  #log .entry.win  { color: var(--gold); }
  #log .entry.err  { color: var(--red); }
  #log .entry.info { color: #50c878; }

  .turn-indicator {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    margin-bottom: 0.5rem;
  }

  .turn-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    transition: all 0.3s;
  }

  .mode-select {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 0.6rem;
  }

  .mode-btn {
    flex: 1;
    padding: 0.4rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: transparent;
    color: #666;
    transition: all 0.2s;
  }

  .mode-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(201,168,76,0.08);
  }

  /* Winner overlay */
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
    gap: 1.5rem;
  }

  #overlay.show { display: flex; }

  #overlay h2 {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    color: var(--gold);
    text-align: center;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

  #overlay button {
    padding: 0.8rem 2.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  #overlay button:hover { background: var(--gold); color: #111; }

  /* Thinking animation */
  .thinking {
    display: none;
    font-size: 0.65rem;
    color: var(--gold);
    letter-spacing: 0.2em;
  }

  .thinking.show { display: block; }

  .thinking::after {
    content: '';
    animation: dots 1.2s steps(3, end) infinite;
  }

  @keyframes dots {
    0%   { content: '.'; }
    33%  { content: '..'; }
    66%  { content: '...'; }
    100% { content: ''; }
  }

  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
    .cell { width: 36px; height: 36px; }
    #board { grid-template-columns: repeat(10, 36px); grid-template-rows: repeat(10, 36px); }
    .piece { width: 28px; height: 28px; font-size: 0.8rem; }
    .coords-top span { width: 36px; }
    .coords-left span { height: 36px; }
  }
</style>
</head>
<body>

<header>
  <h1>CheckersMind</h1>
  <p>Dames 10×10 · Intelligence Artificielle · AlphaZero</p>
</header>

<div class="layout">
  <!-- Board -->
  <div class="board-wrap">
    <div class="coords-top" id="coords-top"></div>
    <div style="display:flex">
      <div class="coords-left" id="coords-left"></div>
      <div id="board"></div>
    </div>
  </div>

  <!-- Panel -->
  <div class="panel">

    <div class="card">
      <h3>Partie</h3>
      <div class="mode-select">
        <button class="mode-btn active" onclick="setMode('human')" id="mode-human">Joueur vs IA</button>
        <button class="mode-btn" onclick="setMode('ai')" id="mode-ai">IA vs IA</button>
      </div>
      <button class="btn primary" onclick="newGame()">Nouvelle partie</button>
      <div class="thinking" id="thinking">IA réfléchit</div>
    </div>

    <div class="card">
      <h3>Score</h3>
      <div class="turn-indicator" id="turn-indicator">
        <div class="turn-dot" id="dot-white" style="background:#f0e6cc"></div>
        <span style="font-size:0.65rem;color:#666">BLANCS</span>
        <div class="turn-dot" id="dot-black" style="background:#333;margin-left:0.5rem"></div>
        <span style="font-size:0.65rem;color:#666">NOIRS</span>
      </div>
      <div class="score-row">
        <span class="score-label">BLANCS</span>
        <span class="score-val white-c" id="whites">20</span>
      </div>
      <div class="score-row">
        <span class="score-label">NOIRS</span>
        <span class="score-val black-c" id="blacks">20</span>
      </div>
    </div>

    <div class="card">
      <h3>Statut</h3>
      <div id="status">Chargement...</div>
    </div>

    <div class="card">
      <h3>Journal</h3>
      <div id="log"></div>
    </div>

    <div class="card">
      <h3>IA</h3>
      <button class="btn" onclick="reloadModel()">↻ Recharger le modèle</button>
      <p style="font-size:0.6rem;color:#444;margin-top:0.4rem;line-height:1.5">
        Après l'entraînement (<code>python main.py train</code>), rechargez le modèle pour mettre à jour l'IA.
      </p>
    </div>

  </div>
</div>

<!-- Winner overlay -->
<div id="overlay">
  <h2 id="overlay-msg">Partie terminée</h2>
  <button onclick="newGame()">Rejouer</button>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────
let gameState   = null;
let selected    = null;    // {r, c} case sélectionnée
let legalForSel = [];      // coups légaux depuis la sélection
let mode        = 'human'; // 'human' ou 'ai'
let aiPlaying   = false;
let moveCount   = 0;
let lastMove    = null;

// ─── Init ─────────────────────────────────────────────────────────────────
window.onload = () => {
  buildCoords();
  buildBoard();
  newGame();
};

function buildCoords() {
  const top  = document.getElementById('coords-top');
  const left = document.getElementById('coords-left');
  for (let c = 0; c < 10; c++) {
    const s = document.createElement('span');
    s.textContent = c;
    top.appendChild(s);
  }
  for (let r = 0; r < 10; r++) {
    const s = document.createElement('span');
    s.textContent = r;
    left.appendChild(s);
  }
}

function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (let r = 0; r < 10; r++) {
    for (let c = 0; c < 10; c++) {
      const cell = document.createElement('div');
      cell.className = `cell ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.onclick = () => onCellClick(r, c);
      board.appendChild(cell);
    }
  }
}

function getCell(r, c) {
  return document.querySelector(`[data-r="${r}"][data-c="${c}"]`);
}

// ─── API ──────────────────────────────────────────────────────────────────
async function apiCall(path, method='GET', body=null) {
  const opts = { method, headers: {'Content-Type': 'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch('/api' + path, opts);
  return res.json();
}

async function newGame() {
  document.getElementById('overlay').classList.remove('show');
  selected = null;
  legalForSel = [];
  lastMove = null;
  moveCount = 0;
  aiPlaying = false;
  gameState = await apiCall('/new_game', 'POST');
  renderAll();
  addLog('Nouvelle partie commencée', 'info');

  if (mode === 'ai') {
    setTimeout(aiLoop, 300);
  }
}

async function sendMove(path) {
  setThinking(true);
  const data = await apiCall('/move', 'POST', { path });
  setThinking(false);
  gameState = data;
  if (data.ai_move) {
    lastMove = data.ai_move;
    moveCount++;
    addLog(`IA: ${moveNotation(data.ai_move)}`, '');
  }
  renderAll();
  if (data.game_over) endGame(data.winner);
}

async function aiLoop() {
  if (!gameState || gameState.game_over || mode !== 'ai') return;
  setThinking(true);
  const data = await apiCall('/ai_move', 'POST');
  setThinking(false);
  gameState = data;
  if (data.ai_move) {
    lastMove = data.ai_move;
    moveCount++;
    addLog(`${gameState.current_player === 1 ? 'NOIRS' : 'BLANCS'}: ${moveNotation(data.ai_move)}`, '');
  }
  renderAll();
  if (data.game_over) { endGame(data.winner); return; }
  setTimeout(aiLoop, 500);
}

async function reloadModel() {
  const data = await apiCall('/reload_model', 'POST');
  addLog('Modèle rechargé', 'info');
}

// ─── Interaction ──────────────────────────────────────────────────────────
function onCellClick(r, c) {
  if (!gameState || gameState.game_over) return;
  if (mode === 'ai') return;
  if (gameState.current_player !== 1) return; // Human = blancs

  // Clic sur une destination légale
  const target = legalForSel.find(m => m[m.length-1][0] === r && m[m.length-1][1] === c);
  if (target) {
    lastMove = target;
    moveCount++;
    addLog(`Vous: ${moveNotation(target)}`, '');
    selected = null;
    legalForSel = [];
    sendMove(target);
    return;
  }

  // Clic sur une de ses pièces
  const piece = gameState.board[r][c];
  if (piece > 0) {
    selected = {r, c};
    legalForSel = gameState.legal_moves.filter(m => m[0][0] === r && m[0][1] === c);
    renderHighlights();
    return;
  }

  // Clic ailleurs : désélectionner
  selected = null;
  legalForSel = [];
  renderHighlights();
}

// ─── Rendu ────────────────────────────────────────────────────────────────
function renderAll() {
  if (!gameState) return;
  renderBoard();
  renderHighlights();
  renderScore();
  renderStatus();
}

function renderBoard() {
  const { board } = gameState;
  for (let r = 0; r < 10; r++) {
    for (let c = 0; c < 10; c++) {
      const cell = getCell(r, c);
      cell.innerHTML = '';
      cell.classList.remove('last-move');

      // Marquer le dernier coup de l'IA
      if (lastMove) {
        const inPath = lastMove.some(([lr, lc]) => lr === r && lc === c);
        if (inPath) cell.classList.add('last-move');
      }

      const p = board[r][c];
      if (p !== 0) {
        const piece = document.createElement('div');
        piece.className = 'piece';
        if (p > 0) piece.classList.add('white');
        else       piece.classList.add('black');
        if (Math.abs(p) === 2) piece.classList.add('king');
        cell.appendChild(piece);
      }
    }
  }
}

function renderHighlights() {
  document.querySelectorAll('.cell').forEach(cell => {
    cell.classList.remove('selected', 'legal-target');
  });
  if (selected) {
    getCell(selected.r, selected.c).classList.add('selected');
    legalForSel.forEach(m => {
      const [tr, tc] = m[m.length - 1];
      getCell(tr, tc).classList.add('legal-target');
    });
  }
}

function renderScore() {
  document.getElementById('whites').textContent = gameState.whites;
  document.getElementById('blacks').textContent = gameState.blacks;

  const p = gameState.current_player;
  document.getElementById('dot-white').style.boxShadow = p === 1  ? '0 0 8px 3px #f0e6cc' : 'none';
  document.getElementById('dot-black').style.boxShadow = p === -1 ? '0 0 8px 3px #888'    : 'none';
}

function renderStatus() {
  const s = document.getElementById('status');
  if (gameState.game_over) {
    const w = gameState.winner;
    if (w === 1)  s.innerHTML = '<strong style="color:#f0e6cc">Les BLANCS gagnent !</strong>';
    else if (w === -1) s.innerHTML = '<strong style="color:var(--gold)">Les NOIRS gagnent !</strong>';
    else s.innerHTML = 'Partie nulle (règle des 50 coups)';
    return;
  }
  const player = gameState.current_player === 1 ? 'BLANCS' : 'NOIRS';
  const badge  = gameState.current_player === 1
    ? '<span class="player-badge badge-white">BLANCS</span>'
    : '<span class="player-badge badge-black">NOIRS</span>';

  let txt = `Au tour des ${badge}<br>`;
  txt += `${gameState.legal_moves.length} coups possibles<br>`;
  txt += `Sans capture: ${gameState.no_capture_count}/50`;

  if (mode === 'human' && gameState.current_player === 1) {
    txt += '<br><span style="color:var(--gold);font-size:0.65rem">← Cliquez une pièce blanche</span>';
  }

  s.innerHTML = txt;
}

function endGame(winner) {
  const msg = winner === 1  ? '⬤ BLANCS GAGNENT'
            : winner === -1 ? '⬤ NOIRS GAGNENT'
            : '½ NULLE';
  document.getElementById('overlay-msg').textContent = msg;
  document.getElementById('overlay').classList.add('show');
  addLog(msg, 'win');
}

function addLog(msg, type='') {
  const log = document.getElementById('log');
  const e   = document.createElement('div');
  e.className = `entry ${type}`;
  const time = new Date().toLocaleTimeString('fr', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  e.textContent = `${time}  ${msg}`;
  log.prepend(e);
  // Garder max 40 entrées
  while (log.children.length > 40) log.removeChild(log.lastChild);
}

function moveNotation(path) {
  return path.map(([r, c]) => `(${r},${c})`).join('→');
}

function setMode(m) {
  mode = m;
  document.getElementById('mode-human').classList.toggle('active', m === 'human');
  document.getElementById('mode-ai').classList.toggle('active', m === 'ai');
}

function setThinking(v) {
  document.getElementById('thinking').classList.toggle('show', v);
}
</script>
</body>
</html>
